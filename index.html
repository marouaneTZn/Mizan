
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizan - Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="./js/main.js" defer></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800">

    <header class="bg-white shadow-sm p-5">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-amber-600">Mizan</h1>
            <span class="text-sm text-gray-500">Bijouterie Al Andalous</span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-5 space-y-8">

        <section>
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-xl font-semibold">Cours des métaux</h2>

                <button id="refresh-btn"
                    class="bg-amber-500 text-white px-4 py-2 rounded-lg hover:bg-amber-600 cursor-pointer transition">
                    Actualiser
                </button>
            </div>

            <p id="api-message" class="text-sm text-gray-500 mb-4">
                En attente des données...
            </p>

            <div id="price-cards" class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div class="bg-white p-6 rounded-xl shadow-sm hover:shadow-lg transition">
                    <h3 class="text-lg font-semibold mb-3">Or</h3>
                    <p id="orInMad" class="text-3xl font-bold text-amber-600">-- MAD</p>
                    <p class="text-sm text-gray-500 mt-2">Variation : --</p>
                </div>

                <!-- Silver Card -->
                <div class="bg-white p-6 rounded-xl shadow-sm hover:shadow-lg transition">
                    <h3 class="text-lg font-semibold mb-3">Argent</h3>
                    <p id="silverInMad" class="text-3xl font-bold text-gray-600">-- MAD</p>
                    <p class="text-sm text-gray-500 mt-2">Variation : --</p>
                </div>

            </div>
        </section>

        <section class="bg-white p-6 rounded-xl shadow-sm hover:shadow-md transition">
            <h2 class="text-xl font-semibold mb-5">Estimateur de bijou</h2>

            <form id="estimator-form" class="space-y-4">
                <div>
                    <label for="weight" class="block text-sm mb-2">Poids (grammes)</label>
                    <input type="number" id="weight" placeholder="Ex: 5"
                        class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400">
                </div>

                <div>
                    <label for="metal" class="block text-sm mb-2">Métal</label>
                    <select id="metal"
                        class="w-full border border-gray-300 p-3 rounded-lg">
                        <option value="gold">Or</option>
                        <option value="silver">Argent</option>
                    </select>
                </div>

                <p id="weight-error" class="text-red-500 text-sm"></p>

                <button type="submit"
                    class="bg-amber-500 text-white px-5 py-2 rounded-lg hover:bg-amber-600 transition cursor-pointer">
                    Calculer
                </button>

                <p id="estimated-value" class="text-lg font-semibold"></p>
            </form>
        </section>

        <section class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-semibold mb-3">État de l'API</h2>

            <p class="text-sm text-gray-600">
                Statut : <span id="api-status">En attente</span>
            </p>

            <p class="text-sm text-gray-600 mt-2">
                Dernière mise à jour :
                <span id="last-update">--</span>
            </p>

            <button id="retry-btn"
                class="mt-4 bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition cursor-pointer">
                Réessayer
            </button>
        </section>

    </main>

    <footer class="text-center text-gray-500 text-sm py-6">
        Mizan - Bijouterie Al Andalous
    </footer>
    <script src="js/api.js"></script>
</body>
</html>
